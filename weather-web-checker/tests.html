<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Tests — Polymarket Weather Checker</title>
  <style>
    :root { --green: #2ea043; --red: #da3633; --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif; padding: 32px 16px; }
    h1 { font-size: 1.3rem; margin-bottom: 8px; }
    .summary { font-size: 1rem; margin-bottom: 24px; padding: 12px 16px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); }
    .pass { color: var(--green); font-weight: 700; }
    .fail { color: var(--red); font-weight: 700; }
    .test { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 0.875rem; display: flex; align-items: flex-start; gap: 10px; }
    .test:last-child { border-bottom: none; }
    .badge { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; }
    .badge-pass { background: var(--green); color: #fff; }
    .badge-fail { background: var(--red); color: #fff; }
    .test-detail { flex: 1; }
    .test-desc { }
    .test-extra { color: var(--muted); font-size: 0.78rem; margin-top: 3px; font-family: monospace; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; max-width: 840px; }
    .card-title { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  </style>
</head>
<body>
  <h1>🧪 Unit Tests</h1>
  <div class="summary" id="summary">Running…</div>
  <div class="card">
    <div class="card-title">Test Results</div>
    <div id="results"></div>
  </div>

  <!-- Load app.js so _testExports is defined -->
  <script src="app.js"></script>
  <script src="tests.js"></script>
  <script>
    const { results, passed, failed } = window._runTests();
    const total = passed + failed;
    const summary = document.getElementById('summary');
    summary.innerHTML = failed === 0
      ? `<span class="pass">✓ All ${total} tests passed</span>`
      : `<span class="pass">✓ ${passed} passed</span> &nbsp; <span class="fail">✗ ${failed} failed</span> &nbsp; (${total} total)`;

    const container = document.getElementById('results');
    for (const r of results) {
      const div = document.createElement('div');
      div.className = 'test';
      const badge = `<div class="badge ${r.ok ? 'badge-pass' : 'badge-fail'}">${r.ok ? '✓' : '✗'}</div>`;
      let extra = '';
      if (!r.ok && r.actual !== undefined) {
        extra = `<div class="test-extra">actual: ${JSON.stringify(r.actual)}  expected: ${JSON.stringify(r.expected)}</div>`;
      } else if (!r.ok && r.tol !== undefined) {
        extra = `<div class="test-extra">actual: ${r.actual}  expected: ${r.expected} ± ${r.tol}</div>`;
      }
      div.innerHTML = `${badge}<div class="test-detail"><div class="test-desc">${r.description}</div>${extra}</div>`;
      container.appendChild(div);
    }
  </script>
</body>
</html>
